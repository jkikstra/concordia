data_path: "/Users/jarmo/Library/CloudStorage/OneDrive-SharedLibraries-IIASA/ECE.prog - Documents/Projects/CMIP7/IAM Data Processing/concordia_cmip7_v0-4-0" # Jarmo; 21.04.2026 and later (on Mac)
data_path: "/pdrive/projects/ece-climate/input_data_concordia/concordia_cmip7_v0-4-0"

# variabledefs_path: "$data_path/input/variabledefinitions/variabledefs-cmip7_v0-4-0.csv" 
